name: Android app (APK / AAB)

# Builds the Android app on every push to HanTutor and publishes the APK on the "android-latest" release
# (anyone can download it: https://github.com/eineye/han_tutor/releases/latest).
# With the signing secrets set, it also builds a signed AAB for Google Play (see docs/ANDROID.md).
on:
  push:
    branches: [HanTutor]
  workflow_dispatch:
    inputs:
      server_url:
        description: '수업 서버 주소 (비우면 오프라인 단독 앱)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      HANTUTOR_SERVER_URL: ${{ inputs.server_url || vars.HANTUTOR_SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself

      - run: npm ci
      - run: npm run build:demo
      - run: npx cap sync android

      - name: Debug APK (install directly on phones)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Signed release AAB (Google Play)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/hangeulon.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/hangeulon-release.aab; fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then cp android/app/build/outputs/apk/release/app-release.apk out/hangeulon-release.apk; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hangeulon-android-${{ github.run_number }}
          path: out/

      - name: Publish APK on the android-latest release
        if: ${{ github.ref_name == 'HanTutor' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "한글온 Android 앱 (최신)" --notes "HanTutor 브랜치가 바뀔 때마다 자동으로 다시 만들어지는 Android 앱입니다. 휴대폰에서 hangeulon.apk 를 내려받아 설치하세요." --latest
          gh release upload android-latest out/hangeulon.apk --clobber
          git push origin "+HEAD:refs/tags/android-latest"
