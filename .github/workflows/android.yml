name: Android app (APK / AAB)

# Builds the student app on every push to HanTutor and publishes the APK (+ version.json for the in-app
# update notice) on the "android-latest" release: https://github.com/eineye/han_tutor/releases/latest
# With the signing secrets set it also builds a signed AAB for Google Play (no update notice inside).
# Class server: set the repository variable HANTUTOR_SERVER_URL (or type it when running by hand);
# without it the app is the self-contained trial app. See docs/ANDROID.md.
on:
  push:
    branches: [HanTutor]
  workflow_dispatch:
    inputs:
      server_url:
        description: '수업 서버 주소 https://… (비우면 서버 없는 시범 앱)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      HANTUTOR_SERVER_URL: ${{ inputs.server_url || vars.HANTUTOR_SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself

      - run: npm ci

      - name: APK for direct install (with update notice)
        env:
          VITE_UPDATE_CHECK: apk
        run: |
          npm run build:app
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Signed AAB for Google Play (no self-update — Play installs updates)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build:app
          npx cap sync android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/hangeulon.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab out/hangeulon-release.aab; fi
          printf '{"versionCode": %s, "versionName": "%s", "apk": "https://github.com/%s/releases/download/android-latest/hangeulon.apk", "builtAt": "%s"}\n' \
            "$APP_VERSION_CODE" "$APP_VERSION_NAME" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > out/version.json
          cat out/version.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hangeulon-android-${{ github.run_number }}
          path: out/

      - name: Publish APK on the android-latest release
        if: ${{ github.ref_name == 'HanTutor' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "한글온 Android 앱 (최신)" --notes "HanTutor 브랜치가 바뀔 때마다 자동으로 다시 만들어지는 Android 앱입니다. 휴대폰에서 hangeulon.apk 를 내려받아 설치하세요." --latest
          # APK first, version.json last: the update notice appears only once the new APK is downloadable
          gh release upload android-latest out/hangeulon.apk --clobber
          gh release upload android-latest out/version.json --clobber
          git push origin "+HEAD:refs/tags/android-latest"
